<!DOCTYPE html>
<html>
<head>
    <title>Contact</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        header {
            background: #0066cc;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background: #333;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-size: 18px;
        }

        nav a:hover {
            color: #00ccff;
        }

        .container {
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .card {
            background: white;
            width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            border-color: #0066cc;
            outline: none;
        }

        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #004c99;
        }

        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>

</head>
<body>

<header>
    <h1>Contact Us</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="team.html">Team</a>
</nav>

<div class="container">
    <div class="card">
        <form onsubmit="return validateForm()">
            <input type="text" id="name" placeholder="Your Name"><br><br>
            <input type="email" id="email" placeholder="Your Email"><br><br>
            <button type="submit">Submit</button>
        </form>
    </div>
</div>

<footer>
    <p>SUZA Club © 2026</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
