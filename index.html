<!DOCTYPE html>
<html>
<head>
    <title>SUZA Club</title>
   <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    color: #333;
}

header {
    background: #0066cc;
    color: white;
    text-align: center;
    padding: 20px;
}

nav {
    background: #333;
    text-align: center;
    padding: 15px;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 15px;
    font-size: 18px;
}

nav a:hover {
    color: #00ccff;
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 50px;
}

.card {
    background: white;
    width: 400px;
    padding: 30px;
    text-align: center;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.card h2 {
    margin-bottom: 15px;
    color: #0066cc;
}

.card p {
    margin-bottom: 20px;
}

button {
    background: #0066cc;
    color: white;
    border: none;
    padding: 12px 20px;
    margin: 5px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #004c99;
}

footer {
    background: #333;
    color: white;
    text-align: center;
    padding: 15px;
    position: fixed;
    bottom: 0;
    width: 100%;
}
</style>
</head>
<body>

<header>
    <h1>SUZA Club Website</h1>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="team.html">Team</a>
</nav>

<div class="container">
    <div class="card">
        <h2>Welcome</h2>
        <p>Welcome to SUZA Club official website.</p>
        <button onclick="showMessage()">Click Me</button>
        <button onclick="toggleDarkMode()">Dark Mode</button>
    </div>
</div>

<footer>
    <p>SUZA Club © 2026</p>
</footer>

<script src="js/script.js"></script>
</body>
</html>
